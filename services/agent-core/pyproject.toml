[project]
name = "voicecore"
version = "0.1.0"
description = "VoiceCore Lab orchestrator: turn-taking, generation runtime, providers, answer engine"
requires-python = ">=3.12"
dependencies = ["websockets>=15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voicecore"]
