[project]
name = "voicecore"
version = "0.1.0"
description = "VoiceCore Lab orchestrator: turn-taking, generation runtime, providers, answer engine"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "onnxruntime>=1.31.1",
    "openai>=3.41.0",
    "websockets>=15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voicecore"]
