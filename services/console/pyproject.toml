[project]
name = "voicecore-console"
version = "0.1.0"
description = "VoiceCore console (Step 10, ADR 0005): agents, knowledge sources, builds and publishing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "voicecore",
]

[tool.uv.sources]
voicecore = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voicecore_console"]
