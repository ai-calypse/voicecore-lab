# Docusaurus writes /concepts/latency as concepts/latency/index.html; serve it at the slash-free URL the
# assistant cites, without a redirect (a redirect would also name the container's port, not the host's).
server {
  listen 8080;
  root /usr/share/nginx/html;
  absolute_redirect off;
  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }
  error_page 404 /404.html;
}
