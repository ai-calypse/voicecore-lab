name: docker
# Image builds and compose stacks: slow, so on pull requests only when their inputs change (CI minutes on a private repo).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - docker-compose.yml
      - '**/Dockerfile'
      - monitoring/**
      - services/**
      - apps/**
      - packages/**
      - harness/smoke.py
      - scripts/**
      - deploy/**
      - docker-compose.prod.yml
      - harness/tests/test_fly_image.py
      - Makefile
      - harness/tests/test_monitoring.py
      - harness/tests/test_install.py
      - harness/install_smoke.py
      - fixtures/docs/acme.zip
      - uv.lock
      - pnpm-lock.yaml
      - .github/workflows/docker.yml
  workflow_dispatch:  # the canary: run by hand (a daily schedule would cost CI minutes every day)

permissions:
  contents: read

concurrency:  # a newer push to the same ref cancels the older run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 300  # every healthcheck green (agent-core /readyz, gateway -probe)
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: smoke test (token, WebSocket, grounded answer)
        run: |
          curl -sf http://localhost:8080/healthz | grep -q '"status":"ok"'
          uv run python harness/smoke.py
          curl -sf http://localhost:5173/embed/voicecore.js >/dev/null
          curl -sf http://localhost:3000/concepts/endpointing | grep -q 'Endpointing'
          curl -sf http://localhost:3000/embed/voicecore.js >/dev/null
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@voicecore/demo..."
      - run: pnpm --filter @voicecore/demo exec playwright install --with-deps chromium
      - name: security headers and CSP (a mock turn through the docs widget breaks no rule)
        run: pnpm --filter @voicecore/demo exec playwright test -c playwright.compose.config.ts
      - name: graceful stop (SIGTERM drains and exits 0)
        run: |
          docker compose stop -t 35 agent-core gateway
          test "$(docker inspect -f '{{.State.ExitCode}}' $(docker compose ps -aq agent-core))" = 0
          test "$(docker inspect -f '{{.State.ExitCode}}' $(docker compose ps -aq gateway))" = 0
      - if: failure()
        run: docker compose logs

  monitoring:  # seam 15: rules and routes with promtool/amtool, then a stopped orchestrator pages the alert sink
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: monitoring/check.sh
      - run: docker compose --profile monitoring config --quiet
      - run: docker compose --profile monitoring build agent-core gateway
      - run: docker compose --profile monitoring up -d --wait --wait-timeout 300 agent-core gateway prometheus alertmanager alert-sink loki alloy grafana
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m docker harness/tests/test_monitoring.py -p no:randomly
      - if: failure()
        run: docker compose --profile monitoring logs

  scale:  # seam 18 on Redis, then two gateways and two orchestrators behind nginx
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["16379:6379"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
      - run: make store-test
      - run: docker compose --profile scale config --quiet
      - run: docker compose --profile scale up -d --build --wait --wait-timeout 300 redis seed orch-1 orch-2 gw-1 gw-2 lb
      - run: uv run pytest -m docker harness/tests/test_scale.py -p no:randomly
      - if: failure()
        run: docker compose --profile scale logs

  fly-image:  # deploy/fly built and run here, never deployed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}  # flyctl config validate needs a login; skipped until the deploy token exists
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: superfly/flyctl-actions/setup-flyctl@dfdfedc86b296f5e5384f755a18bf400409a15d0 # v1.4
        if: env.FLY_API_TOKEN != ''
      - run: flyctl config validate -c deploy/fly/fly.toml
        if: env.FLY_API_TOKEN != ''
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: make fly-image-test
      - name: the production compose overlay is valid
        run: >
          GATEWAY_SECRET=x TURNSTILE_SECRET=x PUBLIC_GATEWAY=x PUBLIC_HOST=x PUBLIC_ORIGIN=x TRUSTED_PROXIES=x PUBLIC_DOCS_URL=x
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile monitoring config --quiet


  installer:  # Step 10: both platform images built here, then create-voicecore to a cited answer, timed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: docker build -t ghcr.io/ai-calypse/voicecore:ci -f deploy/platform/voicecore.Dockerfile --build-arg VERSION=ci .
      - run: docker build -t ghcr.io/ai-calypse/voicecore-gateway:ci -f deploy/platform/gateway.Dockerfile --build-arg VERSION=ci .
      - run: VOICECORE_IMAGE_TAG=ci uv run pytest harness/tests/test_install.py -m docker -v
