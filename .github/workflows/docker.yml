name: docker
# Image builds and compose stacks: slow, so on pull requests only when their inputs change (CI minutes on a private repo).
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - docker-compose.yml
      - '**/Dockerfile'
      - monitoring/**
      - services/**
      - apps/**
      - packages/**
      - harness/smoke.py
      - harness/tests/test_monitoring.py
      - uv.lock
      - pnpm-lock.yaml
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:  # a newer push to the same ref cancels the older run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 300  # every healthcheck green (agent-core /readyz, gateway -probe)
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: smoke test (token, WebSocket, grounded answer)
        run: |
          curl -sf http://localhost:8080/healthz | grep -q '"status":"ok"'
          uv run python harness/smoke.py
          curl -sf http://localhost:5173/embed/voicecore.js >/dev/null
          curl -sf http://localhost:3000/concepts/endpointing | grep -q 'Endpointing'
          curl -sf http://localhost:3000/embed/voicecore.js >/dev/null
      - name: graceful stop (SIGTERM drains and exits 0)
        run: |
          docker compose stop -t 35 agent-core gateway
          test "$(docker inspect -f '{{.State.ExitCode}}' $(docker compose ps -aq agent-core))" = 0
          test "$(docker inspect -f '{{.State.ExitCode}}' $(docker compose ps -aq gateway))" = 0
      - if: failure()
        run: docker compose logs

  monitoring:  # seam 15: rules and routes with promtool/amtool, then a stopped orchestrator pages the alert sink
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: monitoring/check.sh
      - run: docker compose --profile monitoring config --quiet
      - run: docker compose --profile monitoring build agent-core gateway
      - run: docker compose --profile monitoring up -d --wait --wait-timeout 300 agent-core gateway prometheus alertmanager alert-sink loki alloy grafana
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m docker harness/tests/test_monitoring.py -p no:randomly
      - if: failure()
        run: docker compose --profile monitoring logs
