name: ci
on:  # main and pull requests only: a branch push would run everything twice (CI minutes on a private repo)
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:  # a newer push to the same ref cancels the older run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/realtime-gateway
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"  # the current release with security fixes; go.mod states only the minimum
          cache-dependency-path: services/realtime-gateway/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test ./protocol -run '^$' -fuzz FuzzDecodeFrame -fuzztime 30s
      - run: go vet ./... && go test -race ./...
        working-directory: experiments

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/answer_vectors_*.npy
          key: answer-vectors-${{ hashFiles('fixtures/docs/uv/**', 'apps/docs/docs/**', 'services/agent-core/voicecore/answer/ingest.py') }}
      - run: uv run pytest -m "not live and not docker"
      - run: uv run python harness/baseline_deepgram.py --self-test

  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"  # the current release with security fixes; go.mod states only the minimum
          cache-dependency-path: services/realtime-gateway/go.sum
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/answer_vectors_*.npy
          key: answer-vectors-${{ hashFiles('fixtures/docs/uv/**', 'apps/docs/docs/**', 'services/agent-core/voicecore/answer/ingest.py') }}
      - run: pnpm --filter @voicecore/demo exec playwright install --with-deps chromium
      - run: pnpm --filter @voicecore/demo e2e

  console-e2e:  # Step 10: setup, upload, publish, a cited answer in the Test tab, the snippet (free mode, no keys)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache-dependency-path: services/realtime-gateway/go.sum
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - run: pnpm --filter @voicecore/console exec playwright install --with-deps chromium
      - run: pnpm --filter @voicecore/console e2e

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: pnpm --filter @voicecore/docs build
      - name: every passage the assistant can cite exists on the built site
        run: uv run python harness/check_docs_anchors.py
      - run: pnpm --filter @voicecore/docs exec playwright install --with-deps chromium
      - run: pnpm --filter @voicecore/docs exec playwright test

