name: ci
on: [push, pull_request]

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/realtime-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/realtime-gateway/go.mod
          cache-dependency-path: services/realtime-gateway/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test ./protocol -run '^$' -fuzz FuzzDecodeFrame -fuzztime 30s

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/cache@v4
        with:
          path: .cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - uses: actions/cache@v4
        with:
          path: .cache/answer_vectors_*.npy
          key: answer-vectors-${{ hashFiles('fixtures/docs/uv/**', 'services/agent-core/voicecore/answer/ingest.py') }}
      - run: uv run pytest -m "not live"
      - run: uv run python harness/baseline_deepgram.py --self-test

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/realtime-gateway/go.mod
          cache-dependency-path: services/realtime-gateway/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: pnpm --filter @voicecore/demo exec playwright install --with-deps chromium
      - run: pnpm --filter @voicecore/demo e2e
