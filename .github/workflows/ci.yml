name: ci
on: [push, pull_request]

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/realtime-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/realtime-gateway/go.mod
          cache-dependency-path: services/realtime-gateway/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test ./protocol -run '^$' -fuzz FuzzDecodeFrame -fuzztime 30s

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -m "not live"
      - run: uv run python harness/baseline_deepgram.py --self-test

  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
