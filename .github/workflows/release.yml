name: release
# A version tag (v0.1.0) publishes the platform (Step 10): both images to GHCR for amd64 and arm64, the installer to
# npm with provenance, then a timed install from what was just published. Tags are pushed by the owner only.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: voicecore
            file: deploy/platform/voicecore.Dockerfile
          - image: voicecore-gateway
            file: deploy/platform/gateway.Dockerfile
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: the tag matches the installer's version (images are tagged without the v, as the installer writes them)
        id: v
        run: |
          test "v$(node -p 'require("./packages/create-voicecore/package.json").version')" = "$GITHUB_REF_NAME"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/ai-calypse/${{ matrix.image }}:${{ steps.v.outputs.version }}
            ghcr.io/ai-calypse/${{ matrix.image }}:latest
          labels: org.opencontainers.image.source=https://github.com/ai-calypse/voicecore-lab

  npm:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # npm provenance (trusted publishing)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: publish (a version already on npm, such as the hand-published first one, is left as it is)
        working-directory: packages/create-voicecore
        run: |
          v=$(node -p 'require("./package.json").version')
          if npm view "create-voicecore@$v" version >/dev/null 2>&1; then echo "create-voicecore@$v is already on npm"; exit 0; fi
          npm publish --provenance --access public

  install-timed:  # what a new user gets: published images, a clean runner, ten minutes at most
    needs: npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - run: uv sync --locked
      - run: uv run python harness/install_smoke.py --dir "$RUNNER_TEMP/voicecore" --image-tag "${GITHUB_REF_NAME#v}" --deadline 600 | tee install.json
        # the report's elapsed_s is "measured (CI runner, free mode, images downloaded)"
