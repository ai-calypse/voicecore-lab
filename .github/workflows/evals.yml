name: evals
on:  # main and pull requests only: a branch push would run everything twice (CI minutes on a private repo)
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:  # a newer push to the same ref cancels the older run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python harness/gate.py
        env:
          PYTHONPATH: harness
