name: evals
on:  # main and pull requests only: a branch push would run everything twice (CI minutes on a private repo)
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:  # a newer push to the same ref cancels the older run
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run python harness/gate.py
        env:
          PYTHONPATH: harness
