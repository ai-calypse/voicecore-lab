# Local stack: docker compose up --build, then open http://localhost:3000 (docs site with the voice assistant)
# or http://localhost:5173 (demo page and the ?lab=1 timeline)
# Mock providers by default (no keys, no spend). Live: PROVIDERS=live docker compose up, with keys in .env;
# every live session reserves budget in benchmarks/spend_ledger.json first (mounted below).
services:
  agent-core:
    build: { context: ., dockerfile: services/agent-core/Dockerfile }
    command: ["--providers", "${PROVIDERS:-mock}", "--metrics-port", "9464"]
    ports: ["127.0.0.1:9464:9464"]  # /metrics for the host-side harness, localhost only; a prod overlay must drop it with `ports: !reset []`
    environment: ["VOICECORE_VERSION=${VERSION:-dev}", "LOG_FORMAT=json"]  # version: reported by /healthz
    env_file: [{ path: .env, required: false }]
    # Live mode writes the shared budget ledger in ./benchmarks. On Linux, run as your own user so it can:
    #   HOST_UID=$(id -u) HOST_GID=$(id -g) PROVIDERS=live docker compose up
    user: "${HOST_UID:-10001}:${HOST_GID:-10001}"
    volumes: ["./benchmarks:/app/benchmarks"]
    init: true  # tini as PID 1, so SIGTERM reaches Python and open sessions drain (PID 1 ignores it otherwise)
    stop_grace_period: 35s  # the server drains for up to 25 s
    restart: unless-stopped
    healthcheck:  # ready = VAD and docs index loaded and not draining
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 90s
  gateway:
    build: { context: services/realtime-gateway, args: { VERSION: "${VERSION:-dev}" } }  # VERSION=$(git rev-parse --short HEAD)
    command: ["-addr", "0.0.0.0:8080", "-upstream", "ws://agent-core:8765", "-origins", "localhost:*,127.0.0.1:*", "-admin-addr", "0.0.0.0:9091"]
    environment: ["GATEWAY_SECRET=${GATEWAY_SECRET:-}", "TURNSTILE_SECRET=${TURNSTILE_SECRET:-}", "LOG_FORMAT=json"]
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:9091:9091"]  # 9091: /metrics and /debug/counters, localhost only; a prod overlay must use `ports: !override` to drop it
    stop_grace_period: 35s
    restart: unless-stopped
    healthcheck:  # the image is distroless (no curl): the binary probes itself
      test: ["CMD", "/gateway", "-probe", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      agent-core: { condition: service_healthy }
  demo:
    build: { context: ., dockerfile: apps/demo/Dockerfile, args: { VITE_GATEWAY: "${PUBLIC_GATEWAY:-http://localhost:8080}" } }
    ports: ["127.0.0.1:5173:8080"]
    restart: unless-stopped
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"], interval: 10s, timeout: 3s, retries: 3 }
    depends_on: [gateway]
  docs:
    build: { context: ., dockerfile: apps/docs/Dockerfile, args: { VOICECORE_GATEWAY: "${PUBLIC_GATEWAY:-http://localhost:8080}" } }
    ports: ["127.0.0.1:3000:8080"]
    restart: unless-stopped
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"], interval: 10s, timeout: 3s, retries: 3 }
    depends_on: [gateway]

  # --- monitoring profile: docker compose --profile monitoring up --wait (Grafana on http://127.0.0.1:3001) ---
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0
    volumes: ["./monitoring/prometheus:/etc/prometheus:ro"]
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"], interval: 5s, timeout: 3s, retries: 10 }
  alertmanager:
    profiles: [monitoring]
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes: ["./monitoring/alertmanager:/etc/alertmanager:ro"]
    ports: ["127.0.0.1:9093:9093"]
    restart: unless-stopped
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9093/-/ready"], interval: 5s, timeout: 3s, retries: 10 }
  alert-sink:  # the local pager: docker compose logs alert-sink
    profiles: [monitoring]
    image: python:3.13-slim
    command: ["python", "-u", "/sink/sink.py"]
    volumes: ["./monitoring/alert-sink:/sink:ro"]
    restart: unless-stopped
  loki:
    profiles: [monitoring]
    image: grafana/loki:3.6.7
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes: ["./monitoring/loki:/etc/loki:ro", "loki-data:/loki"]
    restart: unless-stopped  # no healthcheck: the image has no shell tools, and Alloy retries its pushes
  alloy:
    profiles: [monitoring]
    image: grafana/alloy:v1.10.0
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy"]
    volumes: ["./monitoring/alloy:/etc/alloy:ro", "/var/run/docker.sock:/var/run/docker.sock:ro"]
    restart: unless-stopped
    depends_on: [loki]
  grafana:
    profiles: [monitoring]
    image: grafana/grafana:12.1.0
    environment: ["GF_AUTH_ANONYMOUS_ENABLED=true", "GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer", "GF_AUTH_DISABLE_LOGIN_FORM=false",
                  "GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/voicecore.json", "GF_ANALYTICS_REPORTING_ENABLED=false"]
    volumes: ["./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro", "./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro"]
    ports: ["127.0.0.1:3001:3000"]
    restart: unless-stopped
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"], interval: 5s, timeout: 3s, retries: 20 }
    depends_on: [prometheus, loki]

  # --- scale profile: docker compose --profile scale up -d --wait redis seed orch-1 orch-2 gw-1 gw-2 lb (LB on 127.0.0.1:8090) ---
  # Mock providers that still reserve and settle small fixed amounts, against one Redis ledger for both orchestrators.
  redis:
    profiles: [scale]
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]  # the spend record must survive a restart
    volumes: ["redis-data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 2s, timeout: 2s, retries: 15 }
  seed:  # copies the file ledger's totals into Redis once, so the caps never restart at 0
    profiles: [scale]
    build: { context: ., dockerfile: services/agent-core/Dockerfile }
    entrypoint: ["/app/.venv/bin/python", "-m", "voicecore.budget", "migrate", "--from", "/app/benchmarks/spend_ledger.json", "--to", "redis://redis:6379/0"]
    volumes: ["./benchmarks:/app/benchmarks:ro"]
    depends_on: { redis: { condition: service_healthy } }
  orch-1: &orch
    profiles: [scale]
    build: { context: ., dockerfile: services/agent-core/Dockerfile }
    command: ["--providers", "mock-billed", "--metrics-port", "9464"]
    environment: ["VOICECORE_LEDGER=redis://redis:6379/0", "LOG_FORMAT=json"]
    init: true
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 90s
    depends_on: { seed: { condition: service_completed_successfully } }
  orch-2: *orch
  gw-1: &gw
    profiles: [scale]
    build: { context: services/realtime-gateway, args: { VERSION: "${VERSION:-dev}" } }
    # every test client shares one address: the per-address limits are off here, and only here
    command: ["-addr", "0.0.0.0:8080", "-upstream", "ws://orch-1:8765,ws://orch-2:8765", "-copy-id", "gw1", "-redis-url", "redis://redis:6379/1",
              "-admin-addr", "0.0.0.0:9091", "-max-sessions-per-ip", "0", "-tokens-per-minute", "0", "-sessions-per-ip-per-day", "0"]
    environment: ["GATEWAY_SECRET=${GATEWAY_SECRET:-scale-profile-shared-secret-of-32+bytes}", "LOG_FORMAT=json"]  # shared: a token from one copy works on the other
    stop_grace_period: 35s
    healthcheck: { test: ["CMD", "/gateway", "-probe", "http://127.0.0.1:8080/readyz"], interval: 5s, timeout: 3s, retries: 3, start_period: 10s }
    depends_on: { orch-1: { condition: service_healthy }, orch-2: { condition: service_healthy } }
  gw-2:
    <<: *gw
    command: ["-addr", "0.0.0.0:8080", "-upstream", "ws://orch-1:8765,ws://orch-2:8765", "-copy-id", "gw2", "-redis-url", "redis://redis:6379/1",
              "-admin-addr", "0.0.0.0:9091", "-max-sessions-per-ip", "0", "-tokens-per-minute", "0", "-sessions-per-ip-per-day", "0"]
  lb:
    profiles: [scale]
    image: nginx:1.27-alpine
    volumes: ["./deploy/scale/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    ports: ["127.0.0.1:8090:8090"]
    depends_on: { gw-1: { condition: service_healthy }, gw-2: { condition: service_healthy } }

volumes:
  loki-data:
  redis-data:
