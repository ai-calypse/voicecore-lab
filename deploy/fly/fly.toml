# Fly app "voicecore": the gateway, the orchestrator and the console (the dashboard, at https://voicecore.fly.dev/) on
# one machine. See docs/ops/deploy.md for the preconditions (secrets, the ledger volume, provider spend limits).
# From the repository root: fly deploy . -c deploy/fly/fly.toml
app = "voicecore"
primary_region = "iad"
kill_signal = "SIGTERM"  # Fly's default is SIGINT
kill_timeout = 45        # the gateway's 25 s drain, then the orchestrator's, plus margin; Fly's default is 5 s
swap_size_mb = 512       # free: a Publish briefly loads the embedding model (~280 MB) next to the voice side

[build]
  dockerfile = "Dockerfile"  # relative to this file; the build context is the repository root (fly deploy .)

[env]
  VOICECORE_ENV = "prod"
  PROVIDERS = "auto"                              # live with the keys (Fly secrets, or the dashboard's Voice page)
  POOL = "public"                                 # the public sub-cap; over it, answers in text
  VOICECORE_LEDGER = "/data/spend_ledger.json"    # on the volume: prod refuses to start otherwise
  LOG_FORMAT = "json"
  DOCS_URL = "https://voicecore-docs.fly.dev/"
  ORIGINS = "voicecore-docs.fly.dev"              # the docs site; other websites are added in the dashboard
  VOICECORE_KEYS_FILE = "/data/providers/keys.json"  # keys saved on the dashboard's Voice page, ahead of the secrets
  AGENTS_DIR = "/data/agents"                     # agents published in the dashboard (data-agent="<id>"), next to the default docs agent
  PUBLIC_VOICE_URL = "https://voicecore.fly.dev"  # the dashboard's embed snippets load the widget from here
  TURNSTILE_SITEKEY = "0x4AAAAAAFuRyEEpXO8YZCvW"  # public: the human check the dashboard's snippets carry
  HOSTS = "voicecore.fly.dev"
  SESSIONS_PER_IP_PER_DAY = "20"
  # Fly's proxy reaches the machine from its private IPv4 range, and appends the app's own public IPs as the
  # rightmost X-Forwarded-For hops; trusting all three makes the client the rightmost untrusted address.
  TRUSTED_PROXIES = "172.16.0.0/12,66.241.124.157/32,2a09:8280:1::1db:4dd9:0/128"

[mounts]
  source = "voicecore_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "60s"
    interval = "15s"
    timeout = "3s"
    method = "GET"
    path = "/readyz"
    headers = { Host = "voicecore.fly.dev" }  # the gateway answers only its -hosts names

[[metrics]]
  port = 9464  # the orchestrator
  path = "/metrics"

[[metrics]]
  port = 9091  # the gateway's admin listener
  path = "/metrics"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
