# Load balancer for the scale profile (Step 09 Phase 10). A resume goes to the gateway copy that owns the session:
# the SDK reconnects to /v1/ws?resume=<session id>, and the id starts with the copy id (s-gw1-..., s-gw2-...).
# Everything else, new sessions and token requests, is round robin.
map $arg_resume $owner {
  ~^s-gw1-  gw1;
  ~^s-gw2-  gw2;
  default   any;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

# Re-resolve the gateways through Docker's DNS: a recreated gateway gets a new address, and an address resolved
# once at start would then send gw1's resumes to whichever container now holds it (seen in the scale tests).
resolver 127.0.0.11 valid=5s ipv6=off;
upstream any { zone any 64k; server gw-1:8080 resolve; server gw-2:8080 resolve; }
upstream gw1 { zone gw1 64k; server gw-1:8080 resolve; }
upstream gw2 { zone gw2 64k; server gw-2:8080 resolve; }

server {
  listen 8090;
  location /v1/ws {
    proxy_pass http://$owner;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }
  location / {
    proxy_pass http://any;
    proxy_set_header Host $host;
  }
}
