# Load balancer for the scale profile (Step 09 Phase 10). A resume goes to the gateway copy that owns the session:
# the SDK reconnects to /v1/ws?resume=<session id>, and the id starts with the copy id (s-gw1-..., s-gw2-...).
# Everything else, new sessions and token requests, is round robin.
map $arg_resume $owner {
  ~^s-gw1-  gw1;
  ~^s-gw2-  gw2;
  default   any;
}

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

upstream any { server gw-1:8080; server gw-2:8080; }
upstream gw1 { server gw-1:8080; }
upstream gw2 { server gw-2:8080; }

server {
  listen 8090;
  location /v1/ws {
    proxy_pass http://$owner;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }
  location / {
    proxy_pass http://any;
    proxy_set_header Host $host;
  }
}
