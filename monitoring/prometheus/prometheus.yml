# Scrapes both services every 5 s and evaluates the alert rules every 15 s (docs/ops/slos.md).
global:
  scrape_interval: 5s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs: [{ targets: ["alertmanager:9093"] }]
scrape_configs:
  - job_name: agent-core
    static_configs: [{ targets: ["agent-core:9464"] }]
  - job_name: gateway
    static_configs: [{ targets: ["gateway:9091"] }]
